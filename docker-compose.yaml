services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bplan

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000

    volumes:
      - ./data:/app/data

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - app

networks:
  app:
    driver: bridge